# ─────────────────────────────────────────────────────────────────
#  Owned OS – Infrastructure Stack
#  Services: Kafka (KRaft, no Zookeeper) + Kafka UI
# ─────────────────────────────────────────────────────────────────

services:

  # ── Kafka (KRaft mode – single-node, no Zookeeper) ──────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: owned-kafka
    hostname: kafka
    ports:
      - "9092:9092"   # for Spring Boot apps running on host (localhost:9092)
      - "9093:9093"   # inter-broker / controller listener (internal)
    environment:
      # ── KRaft cluster identity ──────────────────────────────────
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # ── Listeners ───────────────────────────────────────────────
      # PLAINTEXT  → used by containers inside the Docker network
      # EXTERNAL   → used by apps on the host machine (localhost:9092)
      # CONTROLLER → used for KRaft controller communication
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # ── Topic defaults ───────────────────────────────────────────
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # ── KRaft storage ───────────────────────────────────────────
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"   # stable, fixed cluster UUID

    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Kafka UI (Provectus) – web dashboard ─────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: owned-kafka-ui
    ports:
      - "8090:8080"   # open http://localhost:8090 in your browser
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: owned-os-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    restart: unless-stopped

volumes:
  kafka-data:
    driver: local
