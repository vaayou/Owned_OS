# ─────────────────────────────────────────────────────────────────
#  Owned OS – Production EC2 Deployment (Docker Hub Images)
#  Usage on EC2:
#    DOCKER_USER=your_username docker compose -f docker-compose.prod.yml pull
#    DOCKER_USER=your_username docker compose -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────

services:

  # ── MySQL 8.0 Persistence ───────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: owned-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=512M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-mysql.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Kafka (KRaft mode – single-node) ─────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: owned-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms512m -Xmx768m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Eureka Service Registry ─────────────────────────────────────
  eureka-service:
    image: ${DOCKER_USER:-heavycoder}/owned-eureka:latest
    container_name: owned-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      PORT: 8761
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -Xms192m -Xmx256m"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── User Service ────────────────────────────────────────────────
  user-service:
    image: ${DOCKER_USER:-heavycoder}/owned-user-service:latest
    container_name: owned-user-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      eureka-service:
        condition: service_started
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      PORT: 8081
      EUREKA_SERVER_URL: http://eureka-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/owned_users?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-owned-super-secret-jwt-signing-key-change-in-production}
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -Xms256m -Xmx384m"

  # ── Commerce Service ────────────────────────────────────────────
  commerce-service:
    image: ${DOCKER_USER:-heavycoder}/owned-commerce-service:latest
    container_name: owned-commerce-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      eureka-service:
        condition: service_started
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      PORT: 8082
      EUREKA_SERVER_URL: http://eureka-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/owned_commerce?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -Xms256m -Xmx384m"

  # ── Collection Service ──────────────────────────────────────────
  collection-service:
    image: ${DOCKER_USER:-heavycoder}/owned-collection-service:latest
    container_name: owned-collection-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    depends_on:
      eureka-service:
        condition: service_started
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      PORT: 8083
      EUREKA_SERVER_URL: http://eureka-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/owned_collection?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -Xms256m -Xmx384m"

  # ── Spring Cloud API Gateway ────────────────────────────────────
  gateway:
    image: ${DOCKER_USER:-heavycoder}/owned-gateway:latest
    container_name: owned-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - eureka-service
      - user-service
      - commerce-service
      - collection-service
    environment:
      PORT: 8080
      EUREKA_SERVER_URL: http://eureka-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-owned-super-secret-jwt-signing-key-change-in-production}
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -Xms192m -Xmx256m"

  # ── React Frontend + Nginx Reverse Proxy ────────────────────────
  frontend:
    image: ${DOCKER_USER:-heavycoder}/owned-frontend:latest
    container_name: owned-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - gateway

volumes:
  mysql-data:
    driver: local
  kafka-data:
    driver: local
