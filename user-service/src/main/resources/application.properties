# ── Server ─────────────────────────────────────────────────────────────────────
spring.application.name=user-service
server.port=8081

# ── Eureka Client ─────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ── Database ────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/owned_users?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ─────────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT ──────────────────────────────────────────────────────────────────────────
# Keep this value in sync with the Gateway's jwt.secret
jwt.secret=owned-super-secret-jwt-signing-key-change-in-production
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=604800000

# ── Kafka ────────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=user-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ── Actuator ─────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
