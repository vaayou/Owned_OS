# ── Server ─────────────────────────────────────────────────────────────────────
server.port=8082
spring.application.name=commerce-service

# ── Eureka Client ─────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ── Database ────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/owned_commerce?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Kafka ────────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=commerce-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ── Payment Integration (Razorpay / Stripe) ────────────────────────────────────
payment.razorpay.key-id=rzp_test_dummy_key
payment.razorpay.key-secret=rzp_test_dummy_secret
payment.stripe.secret-key=sk_test_dummy_secret
payment.webhook.secret=whsec_dummy_secret_key

# ── Actuator ─────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
